server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# MySQL Configuration
# Credentials come from environment variables (or the .env file that
# SupportFlowApplication loads automatically). Never commit real credentials.
#
# Set DB_URL for a full override, or set the parts individually:
#   DB_HOST (default localhost) | DB_PORT (default 3306) | DB_NAME (default supportflow_db)
#   DB_USERNAME | DB_PASSWORD
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:supportflow_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate: let Hibernate own the schema so tables are created/updated in place
# without destructive drops.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.open-in-view=false

# Run resources/data.sql after Hibernate has created/updated the tables.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ---------------------------------------------------------------------------
# CORS
# Comma-separated list of allowed origins. Add the Vercel frontend URL here
# (or set the CORS_ALLOWED_ORIGINS env var) when deploying - no code change.
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:5000,http://localhost:8080,https://supportflow-frontend-sigma.vercel.app}

# ---------------------------------------------------------------------------
# JWT Configuration
# Set JWT_SECRET in the environment. The value below is a DEVELOPMENT FALLBACK
# ONLY and must be overridden in any deployed environment.
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:supportflow_dev_only_jwt_secret_replace_me_at_least_32_bytes_long}
jwt.expiration=${JWT_EXPIRATION:86400000}
