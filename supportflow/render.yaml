services:
  - type: web
    name: supportflow-backend
    env: docker
    dockerfilePath: ./supportflow/backend/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: DB_PATH
        value: "supportflow.db"