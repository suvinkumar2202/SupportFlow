services:
  - type: web
    name: supportflow-backend
    env: docker
    dockerfilePath: ./supportflow/backend/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      # MySQL connection. Set these as Render environment variables (or in a
      # linked database) - never commit real credentials here.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Frontend origins allowed by CORS, comma-separated.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
